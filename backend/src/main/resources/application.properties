# SleekTools Backend Configuration

# Server
server.port=8080

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://sleektools.app

# Chat Room Settings
chat.room.max-duration-hours=6
chat.room.max-participants=50
chat.room.id-length=6
chat.message.max-length=2000

# Scheduler
scheduler.room-cleanup.interval-minutes=5

# Logging
logging.level.root=INFO
logging.level.com.sleektools=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator (optional - for monitoring)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
